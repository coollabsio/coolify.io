# Public URL policy: https://coolify.io/slug (apex, https, no trailing slash).
# This container listens on :80 behind Cloudflare. Always emit https://
# Location headers so slash redirects never hop through http://.

server {
    listen 80;
    server_name www.coolify.io;

    # www currently 200s a duplicate of apex. Collapse it when Host is still www.
    # If Cloudflare already rewrites the host, this block is unused.
    return 301 https://coolify.io$request_uri;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log off;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Social / docs shortcuts — permanent, never indexed
    location ~ ^/github/?$ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 301 https://github.com/coollabsio/coolify;
    }
    location ~ ^/discord/?$ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 301 https://coollabs.io/discord;
    }
    location ~ ^/hetzner/?$ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 301 https://coolify.io/docs/hetzner;
    }
    location ~ ^/hidden/?$ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 301 https://www.youtube.com/watch?v=GFq6wH5JR2A;
    }
    location ~ ^/live/?$ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 301 https://twitch.tv/heyandras;
    }

    # Affiliate hops — temporary (codes may change)
    location ~ ^/digitalocean/?$ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 302 https://m.do.co/c/61b0bcb701ab;
    }
    location ~ ^/vultr/?$ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 302 https://www.vultr.com/?ref=9911335;
    }

    # 301 trailing slashes to the https apex, never to http://
    location ~ ^(.+)/$ {
        return 301 https://coolify.io$1;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
    }

    # Astro file output: /pricing → /pricing.html. No SPA fallback to index.html
    # (that caused unknown paths like /blog to soft-200 the homepage).
    location / {
        try_files $uri $uri.html =404;
        add_header Cache-Control "no-cache";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
}
