server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log off;

    # Send relative Location headers. Behind the proxy nginx only sees http,
    # so absolute redirects pointed at http://coolify.io/...
    absolute_redirect off;

    # Unknown paths get a real 404 with the noindex page from src/pages/404.astro
    error_page 404 /404.html;

    # Short links: real HTTP redirects (keep in sync with `redirects` in astro.config.mjs)
    location = /discord      { return 302 https://coollabs.io/discord; }
    location = /github       { return 302 https://github.com/coollabsio/coolify; }
    location = /live         { return 302 https://twitch.tv/heyandras; }
    location = /hetzner      { return 302 https://coolify.io/docs/hetzner; }
    location = /digitalocean { return 302 https://m.do.co/c/61b0bcb701ab; }
    location = /vultr        { return 302 https://www.vultr.com/?ref=9911335; }
    location = /hidden       { return 302 https://www.youtube.com/watch?v=GFq6wH5JR2A; }
    location = /philosophy   { return 302 https://coollabs.io/philosophy; }

    # Permanent alias for the comparison page. Exact match wins over the
    # trailing-slash rule, so /compare/ goes straight to the page instead of
    # 301ing to /compare and back.
    location = /compare/ { return 301 /compare/coolify-vs-dokploy-vs-caprover-vs-dokku-vs-kamal; }
    location = /compare  { return 301 /compare/coolify-vs-dokploy-vs-caprover-vs-dokku-vs-kamal; }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 301 redirect trailing slashes to non-trailing-slash URLs
    location ~ ^(.+)/$ {
        return 301 $1;
    }

    # Homepage
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    # Handle Astro routing (build.format "file": /page is served from page.html)
    location / {
        try_files $uri $uri.html =404;
        add_header Cache-Control "no-cache";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
}
